name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: aegis-seal-gateway
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 100monkeys-ai/aegis-proto
          path: aegis-proto
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-09-12; toolchain pinned by rust-toolchain.toml and the input below
        with:
          toolchain: "1.98.1"
          components: clippy
      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: aegis-seal-gateway -> target
      - name: Cargo check
        working-directory: aegis-seal-gateway
        run: cargo check --locked
      - name: Clippy
        working-directory: aegis-seal-gateway
        run: cargo clippy --locked -- -D warnings

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: aegis-seal-gateway
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-09-12; toolchain pinned by rust-toolchain.toml and the input below
        with:
          toolchain: "1.98.1"
          components: rustfmt
      - name: Check formatting
        working-directory: aegis-seal-gateway
        run: cargo fmt --all -- --check

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seal_gateway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: aegis-seal-gateway
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 100monkeys-ai/aegis-proto
          path: aegis-proto
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-09-12; toolchain pinned by rust-toolchain.toml and the input below
        with:
          toolchain: "1.98.1"
      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: aegis-seal-gateway -> target
      - name: Run tests
        working-directory: aegis-seal-gateway
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/seal_gateway_test
        run: cargo test --locked

  package:
    name: Package verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: aegis-seal-gateway
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 100monkeys-ai/aegis-proto
          path: aegis-proto
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-09-12; toolchain pinned by rust-toolchain.toml and the input below
        with:
          toolchain: "1.98.1"
      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: aegis-seal-gateway -> target
      - name: Prepare proto files for packaging
        working-directory: aegis-seal-gateway
        run: |
          mkdir -p proto-vendor/aegis
          if [ ! -f proto-vendor/aegis/seal_gateway.proto ]; then
            cp ../aegis-proto/proto/seal_gateway.proto proto-vendor/aegis/seal_gateway.proto
          fi
      # `cargo package` rewrites the path dependency on aegis-proto into a registry
      # dependency and refuses unless that exact version is already on crates.io,
      # so on every push between a version bump and its public release the job was
      # red for a reason unrelated to this repository (run 39996289763 at 1.2.0-beta).
      # CI builds against the sibling checkout above; crates.io is for public
      # releases only (Jeshua, 2026-10-23). `--list` prints the archive that would
      # be produced without resolving dependencies, and the required files are
      # asserted by name. The real `cargo publish` runs in crates-publish.yml on a tag.
      - name: Verify package includes all required files
        working-directory: aegis-seal-gateway
        run: |
          cargo package --list --no-verify --allow-dirty > package-files.txt
          status=0
          for f in Cargo.toml Cargo.lock README.md LICENSE build.rs src/main.rs proto-vendor/aegis/seal_gateway.proto; do
            if grep -qx "$f" package-files.txt; then
              echo "ok      $f"
            else
              echo "MISSING $f"; status=1
            fi
          done
          if [ "$(grep -c '^migrations/' package-files.txt)" -eq 0 ]; then
            echo "MISSING migrations/**"; status=1
          fi
          rm -f package-files.txt
          exit $status
