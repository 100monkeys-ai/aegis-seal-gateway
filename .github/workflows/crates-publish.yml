name: Publish crates.io

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Perform a dry run (no actual publishing)'
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  verify:
    name: Verify build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aegis-seal-gateway
    steps:
      - name: Checkout gateway
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: aegis-seal-gateway

      - name: Checkout proto repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: 100monkeys-ai/aegis-proto
          path: aegis-proto

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master @ 2026-09-03; this action publishes no version tag, and the SHA must be in master's history
        with:
          toolchain: "1.98.1"

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Prepare proto files for packaging
        run: |
          mkdir -p proto-vendor/aegis
          if [ ! -f proto-vendor/aegis/seal_gateway.proto ]; then
            cp ../aegis-proto/proto/seal_gateway.proto proto-vendor/aegis/seal_gateway.proto
          fi

      - name: Verify crate builds
        run: cargo build --locked

      - name: Run tests
        run: cargo test --locked

  publish:
    name: Publish aegis-seal-gateway
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aegis-seal-gateway
    steps:
      - name: Checkout gateway
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: aegis-seal-gateway

      - name: Checkout proto repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: 100monkeys-ai/aegis-proto
          path: aegis-proto

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master @ 2026-09-03; this action publishes no version tag, and the SHA must be in master's history
        with:
          toolchain: "1.98.1"

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Prepare proto files for packaging
        run: |
          mkdir -p proto-vendor/aegis
          if [ ! -f proto-vendor/aegis/seal_gateway.proto ]; then
            cp ../aegis-proto/proto/seal_gateway.proto proto-vendor/aegis/seal_gateway.proto
          fi

      - name: Publish crate
        run: |
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            echo "🔍 DRY RUN: Would publish aegis-seal-gateway"
            cargo publish --locked --allow-dirty --dry-run --token ${{ secrets.CRATES_TOKEN }}
          else
            echo "📦 Publishing aegis-seal-gateway to crates.io..."
            cargo publish --locked --allow-dirty --token ${{ secrets.CRATES_TOKEN }}
          fi

  publish-docs:
    name: Publish documentation to docs.rs
    needs: publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aegis-seal-gateway
    steps:
      - name: Checkout gateway
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: aegis-seal-gateway

      - name: Checkout proto repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: 100monkeys-ai/aegis-proto
          path: aegis-proto

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master @ 2026-09-03; this action publishes no version tag, and the SHA must be in master's history
        with:
          toolchain: "1.98.1"

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Prepare proto files for packaging
        run: |
          mkdir -p proto-vendor/aegis
          if [ ! -f proto-vendor/aegis/seal_gateway.proto ]; then
            cp ../aegis-proto/proto/seal_gateway.proto proto-vendor/aegis/seal_gateway.proto
          fi

      - name: Generate documentation
        run: |
          RUSTDOCFLAGS="--cfg docsrs" cargo doc --locked --no-deps --document-private-items

      - name: Log documentation URL
        run: |
          echo "📚 Documentation will be available at:"
          echo "  - https://docs.rs/aegis-seal-gateway"
          echo ""
          echo "Note: docs.rs automatically publishes documentation after crates.io publish"

  publish-summary:
    name: Publish Summary
    needs: [publish, publish-docs]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check publish status
        run: |
          echo "✅ Publishing workflow completed"
          echo "📦 Published package: aegis-seal-gateway"
          echo "🔗 Crates.io: https://crates.io/crates/aegis-seal-gateway"
          echo "🔗 Docs.rs: https://docs.rs/aegis-seal-gateway"
