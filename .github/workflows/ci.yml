name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: aegis-seal-gateway
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 100monkeys-ai/aegis-proto
          path: aegis-proto
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-09-12; toolchain pinned by rust-toolchain.toml and the input below
        with:
          toolchain: "1.98.1"
          components: clippy
      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: aegis-seal-gateway -> target
      - name: Cargo check
        working-directory: aegis-seal-gateway
        run: cargo check --locked
      - name: Clippy
        working-directory: aegis-seal-gateway
        run: cargo clippy --locked -- -D warnings

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: aegis-seal-gateway
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-09-12; toolchain pinned by rust-toolchain.toml and the input below
        with:
          toolchain: "1.98.1"
          components: rustfmt
      - name: Check formatting
        working-directory: aegis-seal-gateway
        run: cargo fmt --all -- --check

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seal_gateway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: aegis-seal-gateway
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 100monkeys-ai/aegis-proto
          path: aegis-proto
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-09-12; toolchain pinned by rust-toolchain.toml and the input below
        with:
          toolchain: "1.98.1"
      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: aegis-seal-gateway -> target
      - name: Run tests
        working-directory: aegis-seal-gateway
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/seal_gateway_test
        run: cargo test --locked
