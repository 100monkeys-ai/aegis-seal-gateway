name: Verify Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'README.md'
      - 'build.rs'
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'README.md'
      - 'build.rs'

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: "--cfg docsrs -D warnings"

permissions:
  contents: read

jobs:
  verify-docs:
    name: Verify Documentation Builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aegis-seal-gateway
    steps:
      - name: Checkout gateway
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: aegis-seal-gateway

      - name: Checkout proto repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: 100monkeys-ai/aegis-proto
          path: aegis-proto

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master @ 2026-09-03; toolchain pinned by rust-toolchain.toml and the input below
        with:
          toolchain: "1.98.1"

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Prepare proto files for docs build
        run: |
          mkdir -p proto-vendor/aegis
          cp ../aegis-proto/proto/seal_gateway.proto proto-vendor/aegis/seal_gateway.proto

      - name: Build documentation
        run: |
          cargo doc --locked --no-deps --document-private-items -p aegis-seal-gateway

      - name: Verify documentation
        run: |
          echo "✅ Documentation built successfully"
          echo "📚 docs.rs will publish at: https://docs.rs/aegis-seal-gateway"
