apiVersion: seal.100monkeys.ai/v1
kind: SealGatewayConfig
metadata:
  name: aegis-seal-gateway
  version: "1.0.0"

spec:
  network:
    bind_addr: "0.0.0.0:8089"
    grpc_bind_addr: "0.0.0.0:50055"
    # gRPC over TLS (AEGIS ADR-132 H8): PEM files by path. Without it gRPC is
    # plaintext, and a call carrying a person's credential is refused.
    # grpc_tls:
    #   cert_path: "/etc/aegis/tls/seal-gateway.crt"
    #   key_path: "/etc/aegis/tls/seal-gateway.key"

  database:
    url: "sqlite://gateway.db"

  auth:
    disabled: false
    operator_jwks_uri: "env:SEAL_GATEWAY_OPERATOR_JWKS_URI"
    jwks_cache_ttl_secs: 300
    operator_jwt_issuer: "aegis-keycloak"
    operator_jwt_audience: "aegis-seal-gateway"
    seal_jwt_public_key_pem: ""
    seal_jwt_issuer: "aegis-orchestrator"
    seal_jwt_audience: "aegis-agents"

  credentials:
    openbao_addr: null
    openbao_token: null
    openbao_kv_mount: "secret"
    keycloak_token_exchange_url: null
    keycloak_client_id: null
    keycloak_client_secret: null

  cli:
    container_cli: null
    semantic_judge_url: null
    nfs_server_host: "127.0.0.1"
    nfs_port: 2049
    nfs_mount_port: 20048

  ui:
    enabled: true

  # Remote MCP servers, a tool source registered as data (AEGIS ADR-132 G1).
  # Each server's tools are exposed as <name>.<tool>, listed and called with
  # the acting user's own credential, which the orchestrator resolves and
  # sends on each call; no credential is configured here. The gateway dials
  # public addresses on ports 443 and 80 only.
  # mcp_servers:
  #   - name: "example-notes"
  #     url: "https://mcp.example.com/api/mcp"
  #     description: "An example remote MCP server"
